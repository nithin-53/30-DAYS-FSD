<script>
    let myPromise = new Promise(function(resolve,reject){
        let result = false;
        if(result){
            resolve("success");
        }
        else{
            reject("failed");
        }
    });
    myPromise.then(function(a1){
        return console.log(a1);
    });
    myPromise.catch(function(a2){
        return console.log(a2);
    });
</script>
