<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <script src="portfolio.js"></script>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        .main1{
            width: 100vw;
            height: 10vh;
            background-color: rgb(240, 225, 12);
            position: relative;
        }
        .main11{
            position: absolute;
            top: 50%;
            left: 8%;
            transform: translate(-50%,-50%);
            font-size: x-large;

        }
        .main1 h1{
            margin:0;
            color: rgb(0, 0, 0);
        }
        .main2{
            width: 100vw;
            height: 80vh;
            background-color: rgb(30, 4, 109);
            position: relative;              
            
        }
        .main3{
            width: 100vw;
            height: 10vh;
            background-color: rgb(240, 225, 12);
            
        }
        .main2 img{
            width: 100%;
            height: 100%;
        }
        .main21{
            position: absolute;
            top: 100px;
            left: 100px;
            font-size: larger;
            margin: 0%;
            color: white;
        }
        .main22{
            position: absolute;
            top: 360px;
            left: 100px;

        }
        .main22 button{
            width: 100px;
            height: 40px;
            font-size: larger;
            background-color: rgb(240, 225, 12);
            border-radius: 10px;
        }
        .main23{
            position: absolute;
            top: 50px;
            right: 600px;
            border-radius: 50%;
        }
        .main23 img{
            position: absolute;
            height: 400px;
            width: 320px;
            border-radius: 30%;

        }
        .main24{
            position: absolute;
            top: 200px;
            right: 180px;
            display: none;

        }
    </style>
</head>
<body>
    <div class="main1">
       <div class="main11">
            <h1>
               NITHIN
            </h1>
        </div>

    </div>
    <div class="main2">
        <img src="img1.jpg" alt="">
        <div class="main21">
            <h1 id="h1">Hi there</h1>
            <h1 id="h2">This is Nithin</h1>
            <h1 id="h3">a web developer and designer.</h1>
        </div>
        <div class="main22">
            <button id="but">about</button>
        </div>
        <div class="main23" id="visible">
            <img src="img2.jpg" alt="">

        </div>
        <div class="main24" id="hidden">
            <h1>this is hidden</h1>
            <h1>appear only when event occurs</h1>

        </div>
    </div>
    <div class="main3">

    </div>
</body>
<script>
    document.getElementById('but').onclick=function(){
        document.getElementById('hidden').style.display="block";
        document.getElementById('visible').style.display="none";
        document.getElementById('hidden').style.color="white";
        document.getElementById('hidden').style.fontSize="xx-large";
        document.getElementById('h1').innerHTML="web developer";
        document.getElementById('h2').innerHTML="and designer";
        document.getElementById('h3').innerHTML="BE graduate (CSE)"; 
        }
</script>
</html>
